<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가치 카드 — 이토록 멋진 코칭</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f8f5fc;
    --bg2:       #fdf6f0;
    --surface:   #ffffff;
    --ink:       #2b2638;
    --ink-2:     #4a4459;
    --ink-3:     #6b6478;
    --accent:    #6d5bd0;
    --accent-d:  #5443b3;
    --accent-l:  #ece8fb;
    --line:      #e3dcef;
    --heart:     #e0607e;
    --r:         20px;
    --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif;
  }

  html { font-size: 17px; }
  body {
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%) fixed;
    color: var(--ink);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
    word-break: keep-all;
    overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: var(--font); }

  #app { position: relative; }

  header {
    text-align: center;
    padding: 22px 20px 16px;
    background: #ffffff;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 16px rgba(80,60,140,0.06);
  }
  header h1 {
    font-size: clamp(1.7rem, 5vw, 2.3rem);
    font-weight: 800;
    color: var(--accent-d);
    letter-spacing: 0.02em;
  }
  .subtitle { font-size: 1.1rem; color: var(--ink-2); margin-top: 4px; }
  .header-actions { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
  .nav-btn {
    font-size: 1.05rem; font-weight: 600;
    padding: 9px 22px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent-d); }
  .nav-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .saved-badge {
    position: absolute; top: -8px; right: -8px;
    background: var(--heart); color: #fff;
    border-radius: 50%; width: 24px; height: 24px;
    font-size: 0.8rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff;
  }
  .header-source { font-size: 0.92rem; color: var(--ink-3); margin-top: 10px; }

  /* GRID */
  #grid-view { padding: 26px 16px 60px; max-width: 1200px; margin: 0 auto; }
  .grid-title { text-align: center; font-size: 1.15rem; color: var(--ink-2); margin-bottom: 22px; }
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }

  .mini-card {
    aspect-ratio: 3/4;
    border-radius: 16px;
    border: 1.5px solid rgba(0,0,0,0.05);
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative; overflow: hidden;
    box-shadow: 0 3px 10px rgba(80,60,140,0.08);
    animation: fadeUp 0.4s ease both;
  }
  .mini-card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(80,60,140,0.16); }
  .mini-card:hover .mini-icon { transform: scale(1.12); }
  .mini-icon { font-size: 2.8rem; transition: transform 0.2s; }
  .mini-name { font-size: 1.3rem; font-weight: 700; color: var(--ink); text-align: center; padding: 0 6px; }
  .mini-card.saved-mark::after { content: '♥'; position: absolute; top: 8px; right: 10px; font-size: 1.05rem; color: var(--heart); }

  /* DETAIL */
  #detail-view { display: none; flex-direction: column; align-items: center; padding: 32px 16px 60px; }
  #detail-view.active { display: flex; }
  body.detail-mode header { display: none; }
  body.detail-mode #detail-view { min-height: 100vh; padding-top: 24px; }

  .card-scene {
    perspective: 1200px;
    width: min(370px, 92vw);
    height: min(600px, 158vw);
    cursor: pointer;
    margin-bottom: 22px;
  }
  .card-flipper { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(0.4,0,0.2,1); }
  .card-flipper.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: var(--r); overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    padding: 30px 24px 22px;
    box-shadow: 0 16px 40px rgba(80,60,140,0.16);
  }
  .card-front { background: linear-gradient(180deg, #ffffff 0%, #ffffff 55%, var(--suit-bg, #f3effd) 100%); border: 1.5px solid var(--line); justify-content: center; }
  .card-front-name { font-size: clamp(3rem, 13vw, 3.8rem); font-weight: 800; text-align: center; margin-top: 0; line-height: 1.2; color: var(--ink); }
  .card-front-icon { font-size: clamp(3.4rem,14vw,4.4rem); margin: 22px 0 18px; }
  .card-front-divider { width: 50%; height: 3px; border-radius: 3px; background: var(--suit-c, var(--accent-l)); margin: 4px 0 22px; }
  .card-front-desc { font-size: 1.45rem; font-weight: 600; color: var(--ink); line-height: 1.6; text-align: center; padding: 0 4px; }
  .card-front-hint { font-size: 0.95rem; color: var(--ink-3); position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; }

  .card-back { background: var(--suit-bg, #f3effd); border: 1.5px solid var(--line); transform: rotateY(180deg); padding-top: 26px; }
  .card-back-label { font-size: 1rem; font-weight: 700; color: var(--accent-d); letter-spacing: 0.04em; margin-bottom: 10px; }
  .card-back-icon { font-size: 2.2rem; margin-bottom: 10px; }
  .card-back-content { font-size: 1.12rem; color: var(--ink); line-height: 1.75; text-align: center; padding: 0 2px; flex: 1; }
  .card-back-divider { width: 40%; height: 2px; border-radius: 2px; background: rgba(109,91,208,0.3); margin: 14px 0; }
  .card-back-pledge-label { font-size: 1.05rem; font-weight: 800; color: var(--accent-d); margin-bottom: 8px; }
  .card-back-pledge { font-size: 1.12rem; font-weight: 600; color: var(--ink); line-height: 1.65; text-align: center; background: rgba(255,255,255,0.7); border-radius: 12px; padding: 12px 14px; width: 100%; }
  .card-back-stars { display: none; }

  .flip-hint { font-size: 1rem; color: var(--ink-2); margin-bottom: 16px; }

  .card-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .action-btn { font-size: 1.08rem; font-weight: 600; padding: 13px 24px; border-radius: 999px; cursor: pointer; transition: all 0.2s; border: none; }
  .btn-back { background: var(--surface); border: 1.5px solid var(--line); color: var(--ink); }
  .btn-back:hover { border-color: var(--accent); color: var(--accent-d); }
  .btn-save { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(109,91,208,0.3); }
  .btn-save:hover { background: var(--accent-d); }
  .btn-save.saved-state { background: #fde7ec; color: #c23b5c; border: 1.5px solid #f4b6c4; box-shadow: none; }
  .count-chip { display:inline-block; min-width:24px; margin-left:6px; padding:0 7px; border-radius:12px; background:var(--heart); color:#fff; font-size:0.85rem; font-weight:700; line-height:24px; text-align:center; }
  .count-chip:empty { display:none; }

  /* SAVED */
  #saved-view { display: none; padding: 30px 16px 70px; max-width: 900px; margin: 0 auto; }
  #saved-view.active { display: block; }
  .saved-header { text-align: center; margin-bottom: 24px; }
  .saved-header h2 { font-size: 1.7rem; font-weight: 800; color: var(--accent-d); }
  .saved-header p { font-size: 1.1rem; color: var(--ink-2); margin-top: 6px; }
  .saved-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; margin-bottom: 30px; }
  .saved-mini { aspect-ratio: 3/4; border-radius: 16px; border: 1.5px solid rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: all 0.2s; box-shadow: 0 3px 10px rgba(80,60,140,0.08); }
  .saved-mini:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(80,60,140,0.16); }
  .empty-saved { text-align: center; padding: 50px 20px; color: var(--ink-2); font-size: 1.15rem; line-height: 1.9; grid-column: 1/-1; }
  .empty-saved .empty-icon { font-size: 3rem; display: block; margin-bottom: 14px; }
  .saved-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn-clear { font-size: 1.08rem; font-weight: 600; padding: 13px 24px; border-radius: 999px; border: 1.5px solid #f4b6c4; background: #fff; color: #c23b5c; cursor: pointer; transition: all 0.2s; }
  .btn-clear:hover { background: #fde7ec; }
  .btn-download { font-size: 1.08rem; font-weight: 600; padding: 13px 24px; border-radius: 999px; border: none; background: var(--accent); color: #fff; cursor: pointer; transition: all 0.2s; }
  .btn-download:hover { background: var(--accent-d); }

  /* modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(43,38,56,0.45); z-index: 500; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--surface); border-radius: 18px; width: min(540px,96vw); max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(43,38,56,0.25); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
  .modal-title { font-size: 1.2rem; font-weight: 800; color: var(--accent-d); }
  .modal-close { background: none; border: none; color: var(--ink-3); font-size: 1.8rem; cursor: pointer; line-height: 1; padding: 2px 6px; }
  .modal-close:hover { color: var(--ink); }
  .modal-body { padding: 16px 22px; overflow-y: auto; flex: 1; }
  .modal-hint { font-size: 1rem; color: var(--ink-2); margin-bottom: 10px; }
  .modal-textarea { width: 100%; min-height: 260px; background: #faf8fe; border: 1.5px solid var(--line); border-radius: 10px; color: var(--ink); font-family: var(--font); font-size: 1.05rem; line-height: 1.8; padding: 14px; resize: vertical; outline: none; }
  .modal-textarea:focus { border-color: var(--accent); }
  .modal-footer { padding: 14px 22px 18px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line); }
  .btn-copy { font-size: 1.05rem; font-weight: 700; padding: 11px 22px; border-radius: 999px; border: none; background: var(--accent); color: #fff; cursor: pointer; }
  .btn-copy:hover { background: var(--accent-d); }
  .btn-modal-cancel { font-size: 1.05rem; font-weight: 600; padding: 11px 20px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }

  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--ink); color: #fff; font-size: 1.05rem; font-weight: 600; padding: 12px 24px; border-radius: 999px; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1); z-index: 999; box-shadow: 0 8px 24px rgba(43,38,56,0.25); white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @media (max-width:480px) {
    html { font-size: 16px; }
    .cards-grid, .saved-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .mini-icon { font-size: 2.3rem; }
    .mini-name { font-size: 1.15rem; }
    .card-actions { gap: 6px; flex-wrap: nowrap; }
    .card-actions .action-btn { padding: 11px 13px; font-size: 1rem; white-space: nowrap; }
    .count-chip { min-width: 20px; line-height: 20px; margin-left: 4px; font-size: 0.75rem; padding: 0 5px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>가치 카드</h1>
    <p class="subtitle">가치란 소중한 것, 판단의 기준</p>
    <div class="header-actions">
      <button class="nav-btn active" id="btn-all" onclick="showGrid()">전체 카드</button>
      <button class="nav-btn" id="btn-saved" onclick="showSaved()">
        담은 카드
        <span class="saved-badge" id="saved-badge" style="display:none">0</span>
      </button>
    </div>
    <p class="header-source">출처: 이토록 멋진 코칭 — 이한주 코치</p>
  </header>

  <div id="grid-view">
    <p class="grid-title">카드를 선택하여 당신에게 소중한 가치를 만나세요</p>
    <div class="cards-grid" id="cards-grid"></div>
  </div>

  <div id="detail-view">
    <div class="card-scene" onclick="flipCard()">
      <div class="card-flipper" id="flipper">
        <div class="card-face card-front">
          <div class="card-front-name" id="d-name"></div>
          <div class="card-front-icon" id="d-icon"></div>
          <div class="card-front-divider"></div>
          <div class="card-front-desc" id="d-desc"></div>
          <div class="card-front-hint">👆 눌러서 뒤집기</div>
        </div>
        <div class="card-face card-back">
          <div class="card-back-label">마음의 울림</div>
          <div class="card-back-icon" id="d-back-icon"></div>
          <div class="card-back-content" id="d-back-content"></div>
          <div class="card-back-divider"></div>
          <div class="card-back-pledge-label">오늘의 다짐</div>
          <div class="card-back-pledge" id="d-pledge"></div>
        </div>
      </div>
    </div>
    <p class="flip-hint" id="flip-hint">카드를 누르면 뒷면을 볼 수 있어요</p>
    <div class="card-actions">
      <button class="action-btn btn-back" onclick="showGrid()">전체 카드</button>
      <button class="action-btn btn-back" onclick="showSaved()">담아둔 카드<span class="count-chip" id="detail-count"></span></button>
      <button class="action-btn btn-save" id="save-btn" onclick="toggleSave()">♥ 담아두기</button>
    </div>
  </div>

  <div id="saved-view">
    <div class="saved-header">
      <h2>담은 카드</h2>
      <p>내가 소중히 여기는 가치들</p>
    </div>
    <div class="saved-grid" id="saved-grid"></div>
    <div class="saved-actions">
      <button class="action-btn btn-back" onclick="showGrid()">← 전체로 돌아가기</button>
      <button class="action-btn btn-clear" onclick="clearSaved()">✕ 비우기</button>
      <button class="action-btn btn-download" onclick="downloadSaved()">↓ 내려받기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">담은 카드 내용</span>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="modal-body">
      <p class="modal-hint">전체 선택 후 복사하거나, 아래 복사 버튼을 눌러주세요.</p>
      <textarea class="modal-textarea" id="modal-text" readonly></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-modal-cancel" onclick="closeModalDirect()">닫기</button>
      <button class="btn-copy" onclick="copyText()">📋 전체 복사</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const virtues = [
  { id:1,  suit:'♠', name:'정직',      icon:'💎',
    desc:'진실을 말하고 거짓을 멀리함',
    back:'정직은 용기가 필요합니다. 불편한 진실도 말할 수 있을 때 진정한 신뢰가 시작됩니다. 스스로에게 거짓말하지 않는 것이 모든 정직의 출발점입니다.',
    pledge:'나는 오늘 불편하더라도 진실을 말하겠습니다.' },

  { id:2,  suit:'♠', name:'책임',      icon:'⚓',
    desc:'자신의 의무를 다하는 태도',
    back:'책임은 변명 없이 결과를 받아들이는 성숙함입니다. 내 선택의 주인이 될 때 비로소 진정한 자유와 신뢰가 찾아옵니다.',
    pledge:'나는 오늘 내 말과 행동에 온전히 책임을 지겠습니다.' },

  { id:3,  suit:'♠', name:'자율',      icon:'🦅',
    desc:'외부의 간섭 없이 스스로 결정하고 행동함',
    back:'자율은 규칙의 부재가 아니라 내면의 기준을 가진 자유입니다. 스스로 선택할 때 그 선택에 진정한 의미와 힘이 생깁니다.',
    pledge:'나는 오늘 타인의 시선이 아닌 내 기준으로 결정하겠습니다.' },

  { id:4,  suit:'♠', name:'존중',      icon:'🙌',
    desc:'타인의 존재와 의견을 귀하게 여김',
    back:'존중은 동의가 아닙니다. 다르더라도 그 사람의 존엄을 인정하는 것입니다. 존중은 모든 건강한 관계의 기초입니다.',
    pledge:'나는 오늘 만나는 모든 사람을 귀한 존재로 대하겠습니다.' },

  { id:5,  suit:'♠', name:'공정',      icon:'🌓',
    desc:'편견 없이 공평하게 대우함',
    back:'공정함은 내 편을 드는 것이 아닙니다. 같은 기준이 나에게도 타인에게도 동일하게 적용될 때 진정한 공정이 됩니다.',
    pledge:'나는 오늘 편견 없이 공평한 눈으로 판단하겠습니다.' },

  { id:6,  suit:'♠', name:'배려',      icon:'🌼',
    desc:'다른 사람의 입장과 감정을 생각함',
    back:'배려는 관심에서 시작됩니다. 상대방을 진심으로 바라볼 때, 그 사람이 무엇을 필요로 하는지 보이기 시작합니다.',
    pledge:'나는 오늘 주변 사람들의 마음을 먼저 헤아리겠습니다.' },

  { id:7,  suit:'♠', name:'신뢰',      icon:'🔐',
    desc:'믿고 의지할 수 있는 관계 유지',
    back:'신뢰는 작은 약속의 축적입니다. 오늘 지킨 작은 약속 하나가 내일의 깊은 신뢰를 만듭니다. 신뢰는 쌓는 데 오래 걸리고 무너지는 건 한순간입니다.',
    pledge:'나는 오늘 한 말을 반드시 지키겠습니다.' },

  { id:8,  suit:'♠', name:'성실',      icon:'📚',
    desc:'꾸준하고 성의 있게 행동함',
    back:'성실은 재능보다 강합니다. 기분에 상관없이 꾸준히 하는 것이 결국 큰 결과를 만들어냅니다. 매일의 작은 성실함이 위대한 차이를 만듭니다.',
    pledge:'나는 오늘 감정과 상관없이 해야 할 일을 성의 있게 하겠습니다.' },

  { id:9,  suit:'♠', name:'용기',      icon:'🦁',
    desc:'두려움을 넘어 옳은 일을 선택함',
    back:'용기는 두려움이 없는 것이 아닙니다. 두려움을 느끼면서도 옳은 것을 선택하는 것, 그것이 진정한 용기입니다.',
    pledge:'나는 오늘 두려움 앞에서 물러서지 않고 옳은 선택을 하겠습니다.' },

    pledge:'나는 오늘 내 환경과 일상에 건강한 질서를 만들겠습니다.' },

  { id:47, suit:'♣', name:'지속 가능성', icon:'🌍',
    desc:'나와 사회, 지구의 미래를 함께 고려함',
    back:'지속 가능성은 미래 세대를 위한 배려입니다. 오늘 내 선택이 내일의 세상을 만든다는 것을 기억할 때, 우리는 더 지혜롭게 행동합니다.',
    pledge:'나는 오늘 내 선택이 미래에 미칠 영향을 생각하고 행동하겠습니다.' },
];

const PASTEL = {
  '♠': { bg:'#ece7fb', line:'#b9acef' },
  '♥': { bg:'#fde4e8', line:'#f2a9b8' },
  '♦': { bg:'#fdeedb', line:'#f3c58f' },
  '♣': { bg:'#e0f3e8', line:'#9fd4b4' },
};

let selectedCard = null;
let isFlipped    = false;
let savedIds     = new Set();

async function init() {
  try {
    const raw = localStorage.getItem('value_cards_saved');
    if (raw) savedIds = new Set(JSON.parse(raw));
  } catch(e) {}
  renderGrid();
  updateBadge();
}

async function persistSaved() {
  try { localStorage.setItem('value_cards_saved', JSON.stringify([...savedIds])); } catch(e) {}
  updateBadge();
}

function showGrid() {
  document.body.classList.remove('detail-mode');
  document.getElementById('grid-view').style.display = 'block';
  document.getElementById('detail-view').classList.remove('active');
  document.getElementById('saved-view').classList.remove('active');
  document.getElementById('btn-all').classList.add('active');
  document.getElementById('btn-saved').classList.remove('active');
  isFlipped = false;
  renderGrid();
}

function showSaved() {
  document.body.classList.remove('detail-mode');
  document.getElementById('grid-view').style.display = 'none';
  document.getElementById('detail-view').classList.remove('active');
  document.getElementById('saved-view').classList.add('active');
  document.getElementById('btn-all').classList.remove('active');
  document.getElementById('btn-saved').classList.add('active');
  renderSaved();
}

function showDetail(id) {
  selectedCard = virtues.find(v => v.id === id);
  if (!selectedCard) return;
  isFlipped = false;

  document.getElementById('grid-view').style.display = 'none';
  document.getElementById('saved-view').classList.remove('active');
  document.getElementById('detail-view').classList.add('active');
  document.body.classList.add('detail-mode');
  window.scrollTo(0, 0);
  document.getElementById('btn-all').classList.remove('active');
  document.getElementById('btn-saved').classList.remove('active');

  const p = PASTEL[selectedCard.suit] || PASTEL['♠'];
  const scene = document.querySelector('.card-scene');
  scene.style.setProperty('--suit-c', p.line);
  scene.style.setProperty('--suit-bg', p.bg);
  document.getElementById('d-name').textContent       = selectedCard.name;
  document.getElementById('d-icon').textContent       = selectedCard.icon;
  document.getElementById('d-desc').textContent       = selectedCard.desc;
  document.getElementById('d-back-icon').textContent  = selectedCard.icon;
  document.getElementById('d-back-content').textContent = selectedCard.back;
  document.getElementById('d-pledge').textContent     = selectedCard.pledge;
  document.getElementById('flipper').classList.remove('flipped');
  document.getElementById('flip-hint').textContent    = '카드를 누르면 뒷면을 볼 수 있어요';
  updateSaveBtn();
}

function renderGrid() {
  const grid = document.getElementById('cards-grid');
  grid.innerHTML = '';
  virtues.forEach((v,i) => {
    const div = document.createElement('div');
    div.className = 'mini-card' + (savedIds.has(v.id) ? ' saved-mark' : '');
    div.style.animationDelay = (i*10)+'ms';
    div.style.background = (PASTEL[v.suit]||PASTEL['♠']).bg;
    div.innerHTML = `<span class="mini-icon">${v.icon}</span><span class="mini-name">${v.name}</span>`;
    div.onclick = () => showDetail(v.id);
    grid.appendChild(div);
  });
}

function renderSaved() {
  const grid = document.getElementById('saved-grid');
  if (savedIds.size === 0) {
    grid.innerHTML = `<div class="empty-saved"><span class="empty-icon">🌙</span>아직 담아둔 카드가 없습니다.<br>마음에 드는 가치 카드를 담아두세요.</div>`;
    return;
  }
  grid.innerHTML = '';
  [...savedIds].sort((a,b)=>a-b).forEach(id => {
    const v = virtues.find(x => x.id===id);
    if (!v) return;
    const div = document.createElement('div');
    div.className = 'saved-mini';
    div.style.background = (PASTEL[v.suit]||PASTEL['♠']).bg;
    div.innerHTML = `<span class="mini-icon">${v.icon}</span><span class="mini-name">${v.name}</span>`;
    div.onclick = () => showDetail(v.id);
    grid.appendChild(div);
  });
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('flipper').classList.toggle('flipped', isFlipped);
  document.getElementById('flip-hint').textContent = isFlipped ? '다시 누르면 앞면으로 돌아가요' : '카드를 누르면 뒷면을 볼 수 있어요';
}

function toggleSave() {
  if (!selectedCard) return;
  const id = selectedCard.id;
  if (savedIds.has(id)) { savedIds.delete(id); showToast('카드를 담은 카드에서 제거했습니다'); }
  else { savedIds.add(id); showToast('카드를 담아두었습니다 ♥'); }
  updateSaveBtn();
  persistSaved();
}

function updateSaveBtn() {
  const btn = document.getElementById('save-btn');
  if (!selectedCard) return;
  if (savedIds.has(selectedCard.id)) { btn.textContent='♥ 담아둠'; btn.classList.add('saved-state'); }
  else { btn.textContent='♥ 담아두기'; btn.classList.remove('saved-state'); }
}

function updateBadge() {
  const b = document.getElementById('saved-badge');
  if (savedIds.size > 0) { b.textContent=savedIds.size; b.style.display='flex'; } else b.style.display='none';
  document.getElementById('detail-count').textContent = savedIds.size > 0 ? savedIds.size : '';
}

function clearSaved() {
  if (!savedIds.size) return;
  savedIds.clear(); persistSaved(); renderSaved(); showToast('담아둔 카드를 모두 비웠습니다');
}

function downloadSaved() {
  if (savedIds.size === 0) { showToast('담아둔 카드가 없습니다'); return; }
  const cards = [...savedIds].sort((a,b)=>a-b).map(id => virtues.find(v=>v.id===id)).filter(Boolean);
  const today = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});
  let text = `가치 카드 — 나의 소중한 가치\n`;
  text += `출처: 이토록 멋진 코칭 — 이한주 코치\n`;
  text += `${today}\n`;
  text += `${'─'.repeat(34)}\n\n`;
  cards.forEach((v, i) => {
    text += `${i+1}. ${v.name}  ${v.icon}\n`;
    text += `   ${v.desc}\n\n`;
  });
  text += `${'─'.repeat(34)}\n`;
  text += `총 ${cards.length}개의 가치`;
  document.getElementById('modal-text').value = text;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('open');
}
function copyText() {
  const ta = document.getElementById('modal-text');
  ta.select();
  try {
    navigator.clipboard.writeText(ta.value).then(() => showToast('클립보드에 복사되었습니다 ✓')).catch(() => {
      document.execCommand('copy');
      showToast('클립보드에 복사되었습니다 ✓');
    });
  } catch(e) {
    document.execCommand('copy');
    showToast('클립보드에 복사되었습니다 ✓');
  }
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

init();
</script>
</body>
</html>
